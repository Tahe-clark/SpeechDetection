<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎙️ SpeechFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎙️ SpeechFlow</h1>
    <p class="subtitle">Parlez naturellement, je transcris en temps réel</p>

    <div class="mic-container" id="micContainer">
      <div class="mic-icon">🎤</div>
      <div class="pulse"></div>
    </div>

    <div class="controls">
      <button id="start">▶️ Démarrer</button>
      <button id="stop" disabled>⏹️ Arrêter</button>
    </div>

    <div class="result-box" id="result">
      Cliquez sur <strong>Démarrer</strong> et parlez clairement...
    </div>

    <p class="status" id="status">Prêt à écouter</p>
  </div>

<script>
  let recorder, chunks = [], timeoutId;

  document.getElementById("start").onclick = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recorder = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });
      chunks = [];

      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.start(200);   // force un chunk toutes les 200 ms → très important sur Render !

      document.getElementById("start").disabled = true;
      document.getElementById("stop").disabled = false;
      document.getElementById("micContainer").classList.add("recording");
      document.getElementById("result").innerHTML = "Écoute en cours...<span class='typing'></span>";
    } catch (e) {
      document.getElementById("result").innerHTML = "Micro bloqué";
    }
  };

  document.getElementById("stop").onclick = () => {
    if (recorder && recorder.state !== "inactive") {
      recorder.stop();
      clearTimeout(timeoutId);
      document.getElementById("result").innerHTML = "Transcription...<span class='typing'></span>";
    }
  };

  recorder.onstop = async () => {
    const blob = new Blob(chunks, { type: "audio/webm;codecs=opus" });
    const form = new FormData();
    form.append("file", blob, "voice.webm");

    // Timeout de sécurité 10 secondes
    const controller = new AbortController();
    timeoutId = setTimeout(() => controller.abort(), 10000);

    try {
      const res = await fetch("/transcribe", {
        method: "POST",
        body: form,
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      const data = await res.json();
      document.getElementById("result").innerHTML = data.text?.trim() || "Aucun son détecté";
    } catch (err) {
      clearTimeout(timeoutId);
      document.getElementById("result").innerHTML = "Serveur trop lent – réessayez";
    } finally {
      document.getElementById("stop").disabled = true;
      document.getElementById("start").disabled = false;
      document.getElementById("micContainer").classList.remove("recording");
    }
  };
</script>
</body>
</html>
